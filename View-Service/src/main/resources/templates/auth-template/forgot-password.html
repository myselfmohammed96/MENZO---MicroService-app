<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/global/element/sizing.css">
    <link rel="stylesheet" href="/css/global/element/spacing.css">
    <link rel="stylesheet" href="/css/global/element/colors.css">
    <link rel="stylesheet" href="/css/global/element/element.css">
    <link rel="stylesheet" href="/css/global/element/text.css">
    <link rel="stylesheet" href="/css/global/modal-toast.css">

    <link rel="stylesheet" href="/css/auth-checkout/auth-checkout-nav-bar-footer.css"/>
    <link rel="stylesheet" href="/css/auth-checkout/log-in-reset-forgot-password.css"/>

    <title>Forgot-password</title>
</head>
<body>

<!-- Nav bar -->
<nav id="auth-checkout-nav-bar-container" class="w-100p h-9_7vh d-f jc-c ai-c bg-black">
    <div class="d-f jc-c" id="auth-checkout-nav-bar-logo">
        <a th:href=${pageUrls.indexPage} class="w-23_7vh">
            <img src="/media/global/logo/MENZO_logo.jpg" class="w-100p" alt="">
        </a>
    </div>
</nav>

<!-- Page content -->
<div id="auth-checkout-page-content-container" class="mt-9_7vh min-h-70vh">

    <div id="forgot-password-heading-container" class="pt-50px pb-10px">
        <div class="d-f jc-c">
            <div class="d-f fd-c ai-fs w-fc">
                <h1
                        class="forgot-password-page-heading auth-heading txt-aln-l fs-2_7em txt-3e3e3e fw-500 pt-20px pr-0 pl-0 mb-1p mr-0 ml-0">
                    Oops.. <br>Forgot password?</h1>
                <p class="auth-text txt-aln-c fs-1em txt-a1a1a1">Enter your email or
                    phone number.</p>
            </div>
        </div>
        <form class="forgot-password-form auth-form d-f fd-c jc-c ai-c mt-80px pt-10px pb-10px" th:action=${pageUrls.forgotPasswordSubmit}>

            <div class="w-25p d-f fd-c jc-fs mb-5px h-auto">
                <input type="text"
                       class="form-input fs-1em pt-10px pr-25px pb-5px pl-25px mb-15px ol-none br-none txt-383838 bg-trans"
                       id="email-or-phone" name="email-or-phone" placeholder="Email or Phone number">
                <p id="new-password-error-message" class="error-message m-0 txt-red fs-13px"></p>
            </div>

            <button id="button-form"
                    class="w-25p mt-30px mb-50px pt-8px pb-8px pr-0 pl-0 crsr-p br-rs-5px br-none fs-1em txt-e2e2e2 bg-3e3e3e"
                    type="submit">Forgot password
            </button>
        </form>
    </div>

    <!-- redirection to the sign-in page -->
    <div id="sign-in-redirection" class="txt-aln-c d-f jc-c ai-c mt-50px mb-20px ml-10px fs-0_85em">
        <p class="txt-a1a1a1">Don't have an account?</p>
        <a th:href=${pageUrls.signInPage} class="txt-d-none txt-525252 ml-10px"><strong>Sign in</strong></a>
    </div>

</div>

<!-- Toast notification -->
<div class="toast" id="toast">
    <div class="toast-icon toast-success-icon" id="toast-icon"></div>
    <div class="toast-message-container">
        <h3 id="toast-title">Success!</h3>
        <p id="toast-message">Something went wrong. Please check your connection and try again.</p>
    </div>
    <div class="toast-close-container">
        <span id="toast-close-btn">&#10005;</span>
    </div>
</div>

<!-- Footer -->
<hr class="w-96p ml-2p mt-10px h-1_5px br-none bg-b8b8b8">
<div id="auth-checkout-footer" class="mt-0 mr-30px mb-10px ml-30px p-15px txt-aln-c txt-cacaca">
    <p class="fs-0_85em">© 2026 - All rights reserved by <strong>MENZO</strong></p>
</div>

<script type="module" src="/js/global/toast.js"></script>

</body>
</html>
